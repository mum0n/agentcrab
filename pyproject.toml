[project]
name = "agentcrab"
version = "0.1.0"
description = "Individual-based simulation engine for biological populations, ported from TethysBio (Julia/Agents.jl)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mesa>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "tomllib; python_version < '3.11'",
    "pydantic>=2.0",
    "pyarrow>=12.0",
    "xarray>=2023.1",
    "netCDF4>=1.6",
    "zstandard>=0.21",
    "ipywidgets>=8.0",
    "solara>=1.20",
    "pytest>=7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcrab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
